[package]
name = "aurum-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aurum"
path = "src/main.rs"

[dependencies]
aurum-core = { path = "../aurum-core" }
aurum-audio = { path = "../aurum-audio" }
gpui-kit = "0.9"
serde_json = "1.0.154"
log = "0.4.35"
env_logger = "0.11.11"
crossbeam-channel = "0.5.17"
dirs = "6"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
